<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Work - Interactive Index</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>

    <link rel="stylesheet" href="../../style.css">
    <link rel="stylesheet" href="work.css" />
  </head>
  <body data-barba="wrapper">

   <nav class="navbar">
        <div class="logo">demo.space</div>
        <ul class="nav-links">
            <!-- Thêm ../ để chỉ hướng lùi ra thư mục ngoài cùng -->
            <li><a href="../index.html">Trang chủ</a></li>
            <li><a href="../index.html#services">Dịch vụ</a></li>
            <li><a href="./">Dự án</a></li>
            <li><a href="../about.html">Về chúng tôi</a></li>
            <li><a href="../contact.html" class="nav-btn">Liên hệ</a></li>
        </ul>
        <div class="hamburger"><span></span><span></span></div>
    </nav>
    
    <main data-barba="container" data-barba-namespace="work">
        <div class="bg-grid"></div>

        <!-- HEADER ĐƯỢC LÀM LẠI: Nằm gọn gàng góc phải, né navbar chính -->
        <header >
          <!-- Nút Back thiết kế đồng bộ với nút Menu -->
          <div class="menu-btn" onclick="toggleMenu(true)">
            <span>[ SELECT PROJECT ]</span>
          </div>
        </header>

        <!-- SIDE MENU & OVERLAY -->
        <div id="menu-overlay" onclick="toggleMenu(false)" style="z-index: 9998;"></div>
        <div id="side-menu" style="z-index: 9999;">
          <div class="menu-header">
            <span>SELECT PROJECT</span>
            <div class="close-btn" onclick="toggleMenu(false)" style="pointer-events: auto;">✕</div>
          </div>
          <div class="menu-list" id="menu-list-container"></div>
        </div>

        <!-- HUD BOTTOM -->
        <div class="hud-bottom" style="z-index: 990;">
          <div class="coord-box">AXIS X <span id="ui-x">0.00</span></div>
          <div class="ruler-container">
            <div class="ruler-line"></div>
            <div class="ruler-ticks"></div>
            <div class="ruler-cursor" id="ui-cursor"></div>
          </div>
          <div class="coord-box" style="text-align: right">
            AXIS Y <span id="ui-y">0.00</span>
          </div>
        </div>

        <div id="viewport">
          <div id="canvas"></div>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@barba/core"></script>
    <script src="work.js"></script>
    <script src="../../index.js"></script>
  </body>
</html>
